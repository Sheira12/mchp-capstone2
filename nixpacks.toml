[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs_20", "nodePackages.npm"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction --no-scripts",
  "npm ci",
  "npm run build"
]

[phases.build]
cmds = [
  "php artisan config:clear || true",
  "php artisan view:clear || true"
]

[start]
cmd = "sh start.sh"